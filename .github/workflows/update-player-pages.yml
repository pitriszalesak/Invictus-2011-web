name: Aktualizace hráčských profilů

on:
  push:
    branches:
      - main
    paths:
      - "players-data.js"
      - "scripts/generate-player-pages.mjs"
      - ".github/workflows/update-player-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-profiles-update
  cancel-in-progress: false

jobs:
  update-player-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4

      - name: Vygenerovat hráčské profily
        run: node scripts/generate-player-pages.mjs

      - name: Zkontrolovat změny
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- hraci)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Uložit aktuální profily
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hraci
          git commit -m "Automaticky aktualizovat hráčské profily"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
