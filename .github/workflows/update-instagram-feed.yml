name: Aktualizace Instagram feedu

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-instagram-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Načíst posledních pět příspěvků
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/update-instagram-feed.mjs

      - name: Uložit změnu feedu
        run: |
          if [[ -z "$(git status --porcelain -- instagram-feed.json .instagram-token.enc)" ]]; then
            echo "Instagram feed i token jsou beze změny."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-feed.json
          if [[ -f .instagram-token.enc ]]; then
            git add .instagram-token.enc
          fi
          git commit -m "Aktualizovat Instagram feed"
          git push
