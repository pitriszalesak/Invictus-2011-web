name: Aktualizace sitemap

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "**/*.html"
      - "scripts/generate-sitemap.py"
      - ".github/workflows/update-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-update
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst úplnou historii repozitáře
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vygenerovat mapu webu
        run: python3 scripts/generate-sitemap.py

      - name: Zjistit změny
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Uložit aktuální sitemapu
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Automaticky aktualizovat sitemap"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
